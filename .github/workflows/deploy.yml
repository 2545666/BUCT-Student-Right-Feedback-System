name: 🚀 自动部署到服务器

on:
  push:
    branches: [main]
  workflow_dispatch:  # 允许手动触发

jobs:
  deploy:
    name: 部署应用
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 检出代码
        uses: actions/checkout@v4

      - name: 🧰 配置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 📦 构建前端
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: 📤 上传前端产物
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "frontend/dist/*,frontend/src/App.jsx,.github/workflows/deploy.yml"
          target: "/tmp/siehub-deploy-${{ github.run_id }}"
          rm: true
      
      - name: 🚀 部署到服务器
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script_stop: true
          script: |
            echo "📂 部署前端文件..."
            test -f /tmp/siehub-deploy-${{ github.run_id }}/frontend/dist/index.html
            cp -r /tmp/siehub-deploy-${{ github.run_id }}/frontend/dist/* /var/www/html/

            echo "🧾 同步本次源码与部署配置..."
            cp /tmp/siehub-deploy-${{ github.run_id }}/frontend/src/App.jsx /var/www/student-feedback-system/frontend/src/App.jsx
            mkdir -p /var/www/student-feedback-system/.github/workflows
            cp /tmp/siehub-deploy-${{ github.run_id }}/.github/workflows/deploy.yml /var/www/student-feedback-system/.github/workflows/deploy.yml

            rm -rf /tmp/siehub-deploy-${{ github.run_id }}
            
            echo "✅ 部署完成！"
      
      - name: ✅ 部署成功通知
        if: success()
        run: echo "🎉 部署成功完成！"
      
      - name: ❌ 部署失败通知
        if: failure()
        run: echo "💥 部署失败，请检查日志！"
