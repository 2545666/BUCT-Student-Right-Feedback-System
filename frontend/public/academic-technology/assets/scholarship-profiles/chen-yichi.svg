  <text x="134" y="403" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="34" fill="#355fb3" font-weight="700">三获国奖</text>
  <text x="134" y="462" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="34" fill="#355fb3" font-weight="700">保研上交</text>
