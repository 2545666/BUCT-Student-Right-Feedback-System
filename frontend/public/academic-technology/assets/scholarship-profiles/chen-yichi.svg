  <text x="92" y="1302" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="26" fill="#2e3c53">本地宣传页使用轻量截图卡呈现标题、</text>
  <text x="92" y="1352" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="26" fill="#2e3c53">来源与内容结构。</text>
  <rect x="56" y="1540" width="668" height="92" rx="20" fill="#ffffff"/>
