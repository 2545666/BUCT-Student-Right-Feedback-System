  </defs>
  <rect width="780" height="1688" fill="url(#bg)"/>
  <rect x="0" y="0" width="780" height="180" fill="#ffffff"/>
  <text x="56" y="92" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="56" fill="#111d30" font-weight="700">国奖榜样零距离</text>
