  <text x="162" y="728" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="26" fill="#24344d" font-weight="700">这篇分享讲什么？</text>
  <text x="162" y="784" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="28" fill="#24344d">从专业学习、竞赛实践到</text>
  <text x="162" y="834" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="28" fill="#24344d">节奏管理，记录一条可复</text>
  <text x="162" y="884" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="28" fill="#24344d">用的成长路径。</text>
  <rect x="56" y="1128" width="668" height="364" rx="30" fill="#eef4fb"/>
  <text x="92" y="1198" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="26" fill="#345ca5" font-weight="700">阅读提示</text>
